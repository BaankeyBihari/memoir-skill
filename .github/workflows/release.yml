name: release

# Run with `gh workflow run release.yml --ref main`; the tag is computed, never pushed by hand (SRD FR-6.2).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency: release

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute next YYYY.M.N tag
        id: version
        run: echo "tag=$(scripts/next-version.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v7
        with:
          go-version-file: dashboard/go.mod
          cache-dependency-path: dashboard/go.sum
      - name: Test CLI and installer
        run: |
          python3 test_memoir.py
          python3 scripts/test_install.py
      - name: Test dashboard
        working-directory: dashboard
        run: go test -race ./...
      - name: Package skills bundle
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist
          for skill in memoir memoir-wiki; do echo "$TAG" > "skills/$skill/VERSION"; done
          tar -czf dist/memoir-skills.tar.gz -C skills --exclude='__pycache__' --exclude='*.pyc' --exclude='.DS_Store' memoir memoir-wiki
      - name: Cross-compile dashboard and checksum
        working-directory: dashboard
        env:
          CGO_ENABLED: '0'
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          for os in darwin linux; do
            for arch in arm64 amd64; do
              GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "../dist/memoir-ui-$os-$arch" .
            done
          done
          cd ../dist
          sha256sum memoir-skills.tar.gz memoir-ui-* > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: memoir-release
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: memoir-release
          path: dist
      - name: Publish release bundle and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest --generate-notes
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" dist/* --clobber
      - name: Fast-forward stable to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/stable" -f sha="$GITHUB_SHA" -F force=false ||
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/stable -f sha="$GITHUB_SHA"
