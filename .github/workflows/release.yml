name: release

on:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate CalVer tag
        run: |
          if [[ ! $GITHUB_REF_NAME =~ ^[0-9]{4}\.(0[1-9]|1[0-2])\.[1-9][0-9]*$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' must follow YYYY.MM.N (e.g. 2026.11.1)" >&2
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v7
        with:
          go-version-file: dashboard/go.mod
          cache-dependency-path: dashboard/go.sum
      - name: Test CLI and installer
        run: |
          python3 test_memoir.py
          python3 scripts/test_install.py
      - name: Test dashboard
        working-directory: dashboard
        run: go test -race ./...
      - name: Package skills bundle
        run: |
          mkdir -p dist
          tar -czf dist/memoir-skills.tar.gz -C skills --exclude='__pycache__' --exclude='*.pyc' --exclude='.DS_Store' memoir memoir-wiki
      - name: Cross-compile dashboard and checksum
        working-directory: dashboard
        env:
          CGO_ENABLED: '0'
          VERSION: ${{ github.ref_name }}
        run: |
          for os in darwin linux; do
            for arch in arm64 amd64; do
              GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "../dist/memoir-ui-$os-$arch" .
            done
          done
          cd ../dist
          sha256sum memoir-skills.tar.gz memoir-ui-* > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: memoir-release
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: memoir-release
          path: dist
      - name: Publish release bundle and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" dist/* --clobber
