name: Build memoir-ui
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['dashboard/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: dashboard/go.mod
          cache-dependency-path: dashboard/go.sum
      - name: Cross-compile and checksum
        working-directory: dashboard
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p ../dist
          for os in darwin linux; do
            for arch in arm64 amd64; do
              GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags='-s -w' -o "../dist/memoir-ui-$os-$arch" .
            done
          done
          cd ../dist
          sha256sum memoir-ui-* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: memoir-ui
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: memoir-ui
          path: dist
      - name: Publish binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null ||
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" dist/* --clobber
