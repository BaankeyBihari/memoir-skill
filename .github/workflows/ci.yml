name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Lint
        run: mise run lint
      - name: Test
        run: mise run test
      - name: Build
        run: |
          mise run build
          mise run build:skills
