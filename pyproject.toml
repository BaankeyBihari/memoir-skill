[project]
name = "memoir-skill"
version = "0.0.0"
description = "Local-first memory, session compaction, and cumulative wiki skills for LLM agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "nox>=2024.10.9",
  "pytest>=8.0",
  "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["test_memoir.py", "skills/memoir/tests", "scripts"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["memoir-workspace"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "DTZ", "PLW", "C901"]
ignore = ["E501"]
